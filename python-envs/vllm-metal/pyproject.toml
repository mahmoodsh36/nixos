[project]
name = "vllm-metal-env"
version = "0.1.0"
description = "vLLM Metal (vllm-project/vllm-metal) serving environment for Apple Silicon"
requires-python = "==3.12.*"
# vllm-metal itself is absent on purpose: nix builds it from source (see the
# vllm-metal-src flake input) and injects it. these are its runtime deps,
# mirroring upstream's pyproject, so keep the pins in step with it.
dependencies = [
    "vllm",
    # exact pins: _paged_ops.so is only ABI-safe against the mlx and nanobind
    # it was compiled against.
    "mlx==0.32.0",
    "nanobind==2.10.2",
    "mlx-lm",
    "mlx-vlm>=0.6.2,<0.7.0",
    "llguidance>=1.7.0,<1.8.0",
    # we never import it, but xgrammar's wheels segfault against 0.1.13 and
    # only declare >=0.1.9.
    "apache-tvm-ffi>=0.1.9,<0.1.13",
    # transformers 5.13+ makes MLX Metal unavailable inside the vLLM process.
    "transformers>=5.5.3,<5.13",
    "accelerate>=0.26.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "fastapi[standard]>=0.133.0,<0.137",
    "starlette>=1.0.1",
    "gguf>=0.17.0",
]

[tool.uv.sources]
# a sha, not a version: archs merged after 0.31.3 never reach pypi and main
# still self-reports 0.31.3. keep in step with vllm-metal's own pyproject.
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm", rev = "254d153fdeb6f150edd4fc5a54f9828638481fa8" }
# vLLM ships no macOS wheel on PyPI. this release asset is the only prebuilt
# darwin/arm64 build.
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.26.0/vllm-0.26.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl" }

[tool.uv]
# that wheel needs torch==2.11.0+cpu, which exists for no other platform.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
